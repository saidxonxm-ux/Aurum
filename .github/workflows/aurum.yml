name: Aurum
on:
  schedule:
    - cron: "5 * * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Rejim"
        default: "prices"
        type: choice
        options:
          - prices
          - last
          - stats
          - bt
          - scan
permissions:
  contents: write
concurrency:
  group: aurum
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests
      - run: python bot.py ${{ github.event.inputs.mode || 'scan' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Bazani saqlash
        if: always()
        run: |
          if [ -f signals.db ]; then
            git config user.name "aurum-bot"
            git config user.email "aurum-bot@users.noreply.github.com"
            git add signals.db
            git diff --cached --quiet || (git commit -m "update signals" && git push)
          fi
